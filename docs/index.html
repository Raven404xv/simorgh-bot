<style>
  body {
    margin: 0;
    font-family: Tahoma, Arial, sans-serif;
    font-size: 16px;
    line-height: 1.9;
    color: #e7edf3;
    background: #0b0f14;
  }
  a { color: #7dd3fc; }
  .wrap { max-width: 900px; margin: 0 auto; padding: 0 16px 60px; }

  .top {
    padding: 14px 0;
    border-bottom: 1px solid #1f2a36;
    overflow: hidden;
  }
  .brand { float: right; }
  .brand img { float: right; width: 44px; height: 44px; border-radius: 10px; margin-left: 10px; }
  .brand b { display: block; font-size: 18px; }
  .brand span { display: block; font-size: 13px; color: #8795a4; }
  .top .links { float: left; padding-top: 10px; font-size: 14px; }
  .top .links a { margin-right: 12px; }

  .hero { text-align: center; padding: 32px 8px 20px; }
  .hero img { width: 128px; height: 128px; border-radius: 22px; }
  .hero h1 { font-size: 28px; margin: 12px 0 6px; color: #2dd4bf; }
  .hero p { margin: 6px 0; color: #8795a4; }
  .btns { margin-top: 16px; }
  .btn {
    display: inline-block;
    margin: 4px;
    padding: 9px 18px;
    border-radius: 10px;
    background: #2dd4bf;
    color: #04211c;
    font-weight: bold;
    text-decoration: none;
  }
  .btn.plain { background: #141c26; color: #e7edf3; border: 1px solid #1f2a36; }

  .stats { text-align: center; margin: 10px 0 0; }
  .stat {
    display: inline-block;
    width: 150px;
    margin: 6px;
    padding: 14px 8px;
    background: #141c26;
    border: 1px solid #1f2a36;
    border-radius: 12px;
    vertical-align: top;
  }
  .stat b { display: block; font-size: 20px; color: #2dd4bf; }
  .stat span { font-size: 13px; color: #8795a4; }

  h2 {
    margin: 40px 0 12px;
    padding-bottom: 6px;
    border-bottom: 1px solid #1f2a36;
    font-size: 22px;
    color: #2dd4bf;
  }
  h3 { margin: 18px 0 6px; font-size: 17px; }
  p { margin: 8px 0; }
  ul, ol { padding-right: 22px; margin: 8px 0; }
  li { margin: 6px 0; }
  .muted { color: #8795a4; }
  .ltr { direction: ltr; unicode-bidi: embed; font-family: Consolas, "Courier New", monospace; }

  .note { border-right: 4px solid #58a6ff; background: #0f1f33; padding: 10px 14px; border-radius: 10px; margin: 12px 0; }
  .warn { border-right: 4px solid #e3b341; background: #2a2415; padding: 10px 14px; border-radius: 10px; margin: 12px 0; }
  .danger { border-right: 4px solid #f85149; background: #2a1716; padding: 10px 14px; border-radius: 10px; margin: 12px 0; }
  .ok { border-right: 4px solid #3fb950; background: #14261b; padding: 10px 14px; border-radius: 10px; margin: 12px 0; }

  table { width: 100%; border-collapse: collapse; margin: 10px 0; font-size: 15px; }
  th, td { border: 1px solid #1f2a36; padding: 9px 10px; text-align: right; vertical-align: top; }
  th { background: #1c232c; color: #8795a4; font-weight: normal; }

  .codebox { margin: 10px 0; background: #070a0e; border: 1px solid #1d2733; border-radius: 10px; }
  .codebox .bar { padding: 6px 8px 0; text-align: left; }
  .codebox button {
    padding: 4px 12px;
    border-radius: 8px;
    border: 1px solid #2a3847;
    background: #111923;
    color: #cbd5e1;
    font-family: Tahoma, Arial, sans-serif;
    font-size: 12px;
    cursor: pointer;
  }
  .codebox code {
    display: block;
    direction: ltr;
    text-align: left;
    padding: 6px 14px 14px;
    color: #d6e2ee;
    font-family: Consolas, "Courier New", monospace;
    font-size: 14px;
    white-space: pre;
    overflow-x: auto;
  }

  .step { margin: 24px 0; padding: 16px 18px; background: #141c26; border: 1px solid #1f2a36; border-radius: 14px; }
  .step h3 { margin-top: 0; color: #2dd4bf; }
  .num {
    display: inline-block;
    min-width: 30px;
    text-align: center;
    margin-left: 8px;
    padding: 2px 8px;
    border-radius: 8px;
    background: #2dd4bf;
    color: #04211c;
    font-weight: bold;
  }

  details { margin: 8px 0; padding: 10px 14px; background: #141c26; border: 1px solid #1f2a36; border-radius: 12px; }
  summary { cursor: pointer; font-weight: bold; }

  .footer { margin-top: 48px; padding: 20px 0; text-align: center; color: #8795a4; font-size: 14px; border-top: 1px solid #1f2a36; }
  .footer a { margin: 0 8px; }

  @media (max-width: 600px) {
    .hero h1 { font-size: 24px; }
    .top .links { display: none; }
    .stat { width: 42%; }
  }
</style>
</head>
<body>
<div class="wrap">
