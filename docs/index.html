<style>
  :root {
    --bg: #0b0f14;
    --panel: #10161e;
    --card: #141c26;
    --line: #1f2a36;
    --text: #e7edf3;
    --muted: #8795a4;
    --accent: #2dd4bf;
    --accent-soft: rgba(45, 212, 191, 0.12);
    --link: #7dd3fc;
    --warn: #fbbf24;
    --warn-soft: rgba(251, 191, 36, 0.10);
    --danger: #f87171;
    --danger-soft: rgba(248, 113, 113, 0.10);
    --ok: #4ade80;
    --ok-soft: rgba(74, 222, 128, 0.10);
    --code-bg: #070a0e;
    --shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
    --radius: 16px;
  }
  [data-theme="light"] {
    --bg: #f6f8fb;
    --panel: #ffffff;
    --card: #ffffff;
    --line: #e3e9f0;
    --text: #15202b;
    --muted: #5b6b7c;
    --accent: #0f9d8a;
    --accent-soft: rgba(15, 157, 138, 0.10);
    --link: #0b67b8;
    --warn: #b7791f;
    --warn-soft: rgba(183, 121, 31, 0.08);
    --danger: #c53030;
    --danger-soft: rgba(197, 48, 48, 0.07);
    --ok: #2f855a;
    --ok-soft: rgba(47, 133, 90, 0.08);
    --code-bg: #0f1720;
    --shadow: 0 16px 40px rgba(15, 23, 42, 0.08);
  }

  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; scroll-padding-top: 90px; }
  body {
    margin: 0;
    font-family: Tahoma, "Vazirmatn", "Segoe UI", Arial, sans-serif;
    font-size: 16px;
    line-height: 2;
    color: #e7edf3;
    background-color: #0b0f14;
    background-image: radial-gradient(900px 500px at 85% -10%, rgba(45, 212, 191, 0.12), transparent 60%);
    color: var(--text, #e7edf3);
    background-color: var(--bg, #0b0f14);
    min-height: 100vh;
    transition: background-color .3s ease, color .3s ease;
  }
  a { color: var(--link); text-decoration: none; }
  a:hover { text-decoration: underline; }
  ::selection { background: var(--accent); color: #04211c; }

  /* ---------- Top bar ---------- */
  .topbar {
    position: sticky; top: 0; z-index: 40;
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 12px 22px;
    background: var(--bg);
    border-bottom: 1px solid var(--line);
  }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 18px; }
  .brand .gem {
    width: 34px; height: 34px; border-radius: 10px;
    display: grid; place-items: center;
    background: linear-gradient(135deg, var(--accent), #6366f1);
    color: #fff; font-size: 17px;
  }
  .brand .logo { width: 38px; height: 38px; border-radius: 10px; object-fit: cover; }
  .hero-logo {
    width: 120px; height: 120px; object-fit: contain; margin: 0 auto 14px; display: block;
    filter: drop-shadow(0 10px 30px rgba(56, 189, 248, .35));
  }
  .brand small { display: block; font-weight: 400; color: var(--muted); font-size: 12px; line-height: 1.2; }
  .top-actions { display: flex; align-items: center; gap: 10px; }
  .top-actions a.pill {
    font-size: 14px; padding: 6px 14px; border-radius: 999px;
    border: 1px solid var(--line); color: var(--text); background: var(--panel);
  }
  .top-actions a.pill:hover { border-color: var(--accent); text-decoration: none; }
  .icon-btn {
    width: 38px; height: 38px; border-radius: 10px; cursor: pointer;
    border: 1px solid var(--line); background: var(--panel); color: var(--text);
    display: grid; place-items: center; font-size: 16px; font-family: inherit;
  }
  .icon-btn:hover { border-color: var(--accent); }
  .menu-btn { display: none; }

  /* ---------- Layout ---------- */
  .layout { display: flex; align-items: flex-start; }
  aside.side {
    position: sticky; top: 75px;
    width: 280px; flex-shrink: 0;
    height: calc(100vh - 75px);
    overflow-y: auto;
    padding: 22px 16px 40px;
    border-left: 1px solid var(--line);
    background: var(--panel);
  }
  .search {
    width: 100%; padding: 10px 14px; border-radius: 12px;
    border: 1px solid var(--line); background: var(--card); color: var(--text);
    font-family: inherit; font-size: 14px; margin-bottom: 14px; outline: none;
  }
  .search:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  aside.side h4 {
    margin: 18px 10px 6px; font-size: 12px; font-weight: 600;
    color: var(--muted); letter-spacing: .3px;
  }
  aside.side a {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 12px; margin: 2px 0; border-radius: 10px;
    color: var(--text); font-size: 15px;
    transition: background-color .2s ease, color .2s ease;
  }
  aside.side a::before {
    content: ""; width: 6px; height: 6px; border-radius: 50%;
    background: var(--line); flex-shrink: 0; transition: background-color .2s ease;
  }
  aside.side a:hover { background: var(--card); text-decoration: none; }
  aside.side a.active { background: var(--accent-soft); color: var(--accent); }
  aside.side a.active::before { background: var(--accent); }
  aside.side a.hidden { display: none; }

  main { flex: 1; min-width: 0; padding: 36px 44px 90px; max-width: 980px; }

  /* ---------- Hero ---------- */
  .hero {
    position: relative; overflow: hidden;
    padding: 44px 30px; border-radius: 22px;
    border: 1px solid var(--line);
    background: linear-gradient(160deg, var(--card), var(--panel));
    box-shadow: var(--shadow);
    text-align: center;
  }
  .hero::after {
    content: ""; position: absolute; inset: auto -20% -60% -20%; height: 120%;
    background: radial-gradient(closest-side, var(--accent-soft), transparent);
    pointer-events: none;
  }
  .hero .tag {
    display: inline-block; font-size: 13px; padding: 4px 14px; border-radius: 999px;
    background: var(--accent-soft); color: var(--accent); margin-bottom: 14px;
  }
  .hero h1 { margin: 0 0 8px; font-size: 34px; line-height: 1.4; }
  .hero p.lead { margin: 0 auto; max-width: 620px; color: var(--muted); font-size: 16px; }
  .hero .actions { margin-top: 24px; display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
  .btn {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 10px 20px; border-radius: 12px; font-size: 15px;
    border: 1px solid var(--line); background: var(--panel); color: var(--text);
    transition: transform .15s ease, border-color .2s ease;
  }
  .btn:hover { text-decoration: none; transform: translateY(-1px); border-color: var(--accent); }
  .btn.primary {
    background: linear-gradient(135deg, var(--accent), #38bdf8);
    color: #04211c; border-color: transparent; font-weight: 700;
  }

  .stats {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 12px; margin: 22px 0 6px;
  }
  .stat {
    padding: 16px; border-radius: var(--radius);
    background: var(--card); border: 1px solid var(--line); text-align: center;
  }
  .stat b { display: block; font-size: 20px; color: var(--accent); }
  .stat span { font-size: 13px; color: var(--muted); }

  h2 {
    position: relative;
    margin: 56px 0 14px; padding-bottom: 10px; font-size: 24px;
    border-bottom: 1px solid var(--line);
  }
  h2::after {
    content: ""; position: absolute; right: 0; bottom: -1px;
    width: 64px; height: 2px; background: var(--accent); border-radius: 2px;
  }
  h3 { margin: 22px 0 8px; font-size: 18px; }
  p { margin: 10px 0; }
  ul.list, ol.list { padding-right: 22px; }
  ul.list li, ol.list li { margin: 6px 0; }
  .muted { color: var(--muted); }
  .ltr { direction: ltr; unicode-bidi: isolate; font-family: Consolas, "Courier New", monospace; font-size: .92em; }
  code {
    font-family: Consolas, "Courier New", monospace; font-size: .92em;
    background: var(--accent-soft); color: var(--accent);
    padding: 1px 6px; border-radius: 6px;
  }

  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; margin: 16px 0; }
  .feature {
    padding: 18px; border-radius: var(--radius);
    background: var(--card); border: 1px solid var(--line);
    transition: transform .2s ease, border-color .2s ease;
  }
  .feature:hover { transform: translateY(-2px); border-color: var(--accent); }
  .feature .ico {
    width: 40px; height: 40px; border-radius: 12px; margin-bottom: 10px;
    display: grid; place-items: center; font-size: 19px;
    background: var(--accent-soft);
  }
  .feature h4 { margin: 0 0 6px; font-size: 16px; }
  .feature p { margin: 0; font-size: 14px; color: var(--muted); line-height: 1.85; }

  .callout {
    display: flex; gap: 12px; align-items: flex-start;
    padding: 14px 16px; margin: 16px 0; border-radius: 14px;
    border: 1px solid var(--line); background: var(--card);
  }
  .callout .ci { font-size: 18px; line-height: 1.6; }
  .callout .ct { flex: 1; min-width: 0; }
  .callout strong { display: block; margin-bottom: 2px; }
  .callout.info { background: var(--accent-soft); border-color: transparent; }
  .callout.warn { background: var(--warn-soft); border-color: transparent; }
  .callout.danger { background: var(--danger-soft); border-color: transparent; }
  .callout.ok { background: var(--ok-soft); border-color: transparent; }

  .req { width: 100%; border-collapse: separate; border-spacing: 0; margin: 14px 0; border-radius: 14px; overflow: hidden; border: 1px solid var(--line); }
  .req th, .req td { padding: 12px 14px; text-align: right; vertical-align: top; border-bottom: 1px solid var(--line); }
  .req tr:last-child td { border-bottom: 0; }
  .req th { background: var(--panel); font-weight: 600; font-size: 14px; color: var(--muted); }
  .req td { background: var(--card); font-size: 15px; }

  /* ---------- Steps ---------- */
  .step {
    position: relative; display: flex; gap: 18px;
    margin: 26px 0; padding: 22px; border-radius: 18px;
    background: var(--card); border: 1px solid var(--line);
  }
  .step .num {
    flex-shrink: 0; width: 46px; height: 46px; border-radius: 14px;
    display: grid; place-items: center; font-weight: 800; font-size: 18px;
    background: linear-gradient(135deg, var(--accent), #38bdf8); color: #04211c;
    box-shadow: 0 8px 24px var(--accent-soft);
  }
  .step .body { flex: 1; min-width: 0; }
  .step h3 { margin-top: 2px; }
  .step .time { font-size: 13px; color: var(--muted); margin-top: -4px; }

  .code {
    position: relative; direction: ltr; text-align: left;
    margin: 12px 0; padding: 40px 16px 16px; border-radius: 12px;
    background: var(--code-bg); border: 1px solid #1d2733; overflow-x: auto;
  }
  .code code {
    display: block; background: none; color: #d6e2ee; padding: 0;
    white-space: pre; font-size: 14px; line-height: 1.7;
  }
  .copy {
    position: absolute; top: 10px; left: 10px;
    padding: 4px 12px; border-radius: 8px; border: 1px solid #2a3847;
    background: #111923; color: #cbd5e1; font-family: inherit; font-size: 12px; cursor: pointer;
  }
  .copy:hover { border-color: var(--accent); color: var(--accent); }

  .fields { width: 100%; border-collapse: collapse; margin: 12px 0; font-size: 15px; }
  .fields th, .fields td { border-bottom: 1px solid var(--line); padding: 10px 12px; text-align: right; }
  .fields th { color: var(--muted); font-weight: 600; font-size: 14px; }

  .faq details {
    margin: 10px 0; padding: 14px 18px; border-radius: 14px;
    background: var(--card); border: 1px solid var(--line);
  }
  .faq summary { cursor: pointer; font-weight: 700; list-style: none; }
  .faq summary::-webkit-details-marker { display: none; }
  .faq summary::after { content: "+"; float: left; color: var(--accent); font-size: 18px; }
  .faq details[open] summary::after { content: "−"; }
  .faq details[open] summary { color: var(--accent); margin-bottom: 8px; }

  .footer {
    margin-top: 70px; padding: 28px 22px; text-align: center;
    border-radius: 18px; border: 1px solid var(--line); background: var(--panel);
  }
  .footer .links { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin: 12px 0; }
  .footer .links a { padding: 8px 16px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); }
  .footer p { margin: 6px 0; color: var(--muted); font-size: 14px; }

  .toast {
    position: fixed; bottom: 26px; left: 50%; transform: translateX(-50%) translateY(20px);
    padding: 10px 18px; border-radius: 12px; background: var(--text); color: var(--bg);
    font-size: 14px; opacity: 0; pointer-events: none; transition: all .25s ease; z-index: 60;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  .overlay {
    display: none; position: fixed; inset: 0; background: rgba(0, 0, 0, .45); z-index: 25;
  }
  .overlay.show { display: block; }

  /* ---------- Reveal on scroll ---------- */


  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
  }

  /* ---------- Mobile ---------- */
  @media (max-width: 900px) {
    .menu-btn { display: grid; }
    .layout { display: block; }
    aside.side {
      position: fixed; top: 0; right: 0; bottom: 0; z-index: 30;
      width: 290px; height: 100vh; padding-top: 70px;
      transform: translateX(105%); transition: transform .3s ease;
      box-shadow: -18px 0 50px rgba(0, 0, 0, .35);
    }
    aside.side.open { transform: translateX(0); }
    main { padding: 22px 16px 70px; }
    .hero { padding: 32px 18px; }
    .hero h1 { font-size: 26px; }
    .top-actions a.pill { display: none; }
    .step { flex-direction: column; padding: 18px; }
  }
</style>
</head>
